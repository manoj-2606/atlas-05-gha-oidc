<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000015"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="ar-g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="ar-o" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" fill="#f8fafc" rx="0"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">OIDC Workload Identity Federation — Token Exchange Flow</text>
  <text x="450" y="62" text-anchor="middle" font-size="12" fill="#64748b">Zero stored credentials — GitHub Actions ↔ Azure Entra ID</text>

  <!-- GitHub Actions Runner Box -->
  <rect x="50" y="95" width="340" height="280" rx="12" fill="white" stroke="#1f2937" stroke-width="2" filter="url(#sh)"/>
  <rect x="50" y="95" width="340" height="35" rx="12" fill="#1f2937"/>
  <rect x="50" y="118" width="340" height="12" fill="#1f2937"/>
  <text x="220" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="white">GitHub Actions Runner</text>

  <g transform="translate(75, 145)">
    <rect x="0" y="0" width="290" height="32" rx="6" fill="#f1f5f9"/>
    <text x="15" y="21" font-size="11" fill="#334155"><tspan font-weight="600" fill="#3b82f6">①</tspan>  Workflow starts (push to main)</text>

    <rect x="0" y="42" width="290" height="32" rx="6" fill="#f1f5f9"/>
    <text x="15" y="63" font-size="11" fill="#334155"><tspan font-weight="600" fill="#3b82f6">②</tspan>  Request OIDC token from GitHub</text>

    <rect x="0" y="84" width="290" height="32" rx="6" fill="#dbeafe"/>
    <text x="15" y="105" font-size="11" fill="#1e40af"><tspan font-weight="600">③</tspan>  azure/login@v2 exchanges token</text>

    <rect x="0" y="126" width="290" height="32" rx="6" fill="#f1f5f9"/>
    <text x="15" y="147" font-size="11" fill="#334155"><tspan font-weight="600" fill="#16a34a">⑥</tspan>  az CLI / Terraform work normally</text>

    <rect x="0" y="175" width="290" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="15" y="193" font-size="10" fill="#166534" font-weight="600">permissions:</text>
    <text x="15" y="208" font-size="10" fill="#166534" font-family="monospace">  id-token: write</text>
  </g>

  <!-- Azure Entra ID Box -->
  <rect x="510" y="95" width="340" height="280" rx="12" fill="white" stroke="#0078d4" stroke-width="2" filter="url(#sh)"/>
  <rect x="510" y="95" width="340" height="35" rx="12" fill="#0078d4"/>
  <rect x="510" y="118" width="340" height="12" fill="#0078d4"/>
  <text x="680" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="white">Azure (Entra ID)</text>

  <g transform="translate(535, 145)">
    <rect x="0" y="0" width="290" height="50" rx="6" fill="#eff6ff"/>
    <text x="15" y="18" font-size="11" font-weight="600" fill="#1e40af">App Registration</text>
    <text x="15" y="35" font-size="10" fill="#334155">atlas-05-gha-oidc-sp</text>

    <rect x="0" y="60" width="290" height="90" rx="6" fill="#eff6ff"/>
    <text x="15" y="78" font-size="11" font-weight="600" fill="#1e40af">Federated Credentials</text>
    <text x="25" y="96" font-size="10" fill="#334155">✓ main branch (ref:refs/heads/main)</text>
    <text x="25" y="112" font-size="10" fill="#334155">✓ atlas-05-dev environment</text>
    <text x="25" y="128" font-size="10" fill="#334155">✓ atlas-05-staging environment</text>

    <rect x="0" y="160" width="290" height="32" rx="6" fill="#eff6ff"/>
    <text x="15" y="180" font-size="11" fill="#334155"><tspan font-weight="600" fill="#1e40af">Role:</tspan> Contributor on subscription</text>

    <rect x="0" y="202" width="290" height="32" rx="6" fill="#fef3c7"/>
    <text x="15" y="219" font-size="10" fill="#92400e"><tspan font-weight="600">④</tspan>  Validates token against Fed Cred</text>
  </g>

  <!-- Arrows between boxes -->
  <!-- OIDC token arrow (left to right) -->
  <line x1="390" y1="200" x2="510" y2="200" stroke="#3b82f6" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="403" y="185" width="95" height="18" rx="3" fill="#dbeafe"/>
  <text x="450" y="198" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">OIDC token →</text>

  <!-- Azure token arrow (right to left) -->
  <line x1="510" y1="250" x2="390" y2="250" stroke="#16a34a" stroke-width="2" marker-end="url(#ar-g)"/>
  <rect x="403" y="237" width="95" height="18" rx="3" fill="#d1fae5"/>
  <text x="450" y="250" text-anchor="middle" font-size="9" font-weight="600" fill="#166534">← Azure token</text>

  <!-- What's stored section -->
  <rect x="50" y="400" width="380" height="130" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="75" y="425" font-size="12" font-weight="700" fill="#166534">What gets stored as GitHub Secrets</text>
  <text x="75" y="425" font-size="12" font-weight="700" fill="#166534">What gets stored as GitHub Secrets</text>
  <text x="75" y="448" font-size="11" fill="#334155">AZURE_CLIENT_ID — App Registration ID</text>
  <text x="75" y="468" font-size="11" fill="#334155">AZURE_TENANT_ID — Entra ID tenant</text>
  <text x="75" y="488" font-size="11" fill="#334155">AZURE_SUBSCRIPTION_ID — subscription</text>
  <text x="75" y="516" font-size="10" font-weight="600" fill="#059669">These are identifiers, NOT credentials.</text>
  <text x="75" y="530" font-size="10" fill="#059669">Useless without the OIDC trust chain.</text>

  <!-- What's NOT stored -->
  <rect x="470" y="400" width="380" height="130" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" filter="url(#sh)"/>
  <text x="495" y="425" font-size="12" font-weight="700" fill="#991b1b">What is NOT stored anywhere</text>
  <text x="495" y="448" font-size="11" fill="#334155">✗ No client secret / password</text>
  <text x="495" y="468" font-size="11" fill="#334155">✗ No service principal key</text>
  <text x="495" y="488" font-size="11" fill="#334155">✗ No certificate</text>
  <text x="495" y="508" font-size="11" fill="#334155">✗ No connection string</text>
  <text x="495" y="530" font-size="10" font-weight="600" fill="#dc2626">Authentication = cryptographic token exchange</text>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
