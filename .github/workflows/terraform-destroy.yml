# =============================================================================
# Reusable Workflow: Terraform Destroy
# =============================================================================
# Destroys AKS + ACR infrastructure. Does NOT touch OIDC state.
# Manual trigger only (called by destroy.yml via workflow_dispatch).
#
# Called by: destroy.yml
# Uses: composite action setup-terraform
# Runs: scripts/destroy.sh
# =============================================================================

name: Terraform Destroy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Target environment to destroy (dev or staging)"
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

jobs:
  destroy:
    name: "Destroy (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    environment: atlas-05-destroy
    permissions:
      id-token: write
      contents: read
    steps:
      # --- Checkout repo ---
      - uses: actions/checkout@v4

      # --- Setup Terraform (composite action) ---
      - uses: ./.github/actions/setup-terraform

      # --- Azure Login (OIDC) ---
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --- Terraform Destroy ---
      - name: Terraform Destroy
        run: |
          chmod +x scripts/destroy.sh
          ./scripts/destroy.sh
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --- Error logging ---
      - name: Log error context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-context-destroy
          path: error-context.json
          retention-days: 1