# =============================================================================
# Default Values — overridden by values-dev.yaml / values-staging.yaml
# =============================================================================

replicaCount: 1

image:
  repository: ""       # Set by deploy.sh: ACR_LOGIN_SERVER/IMAGE_NAME
  tag: ""              # Set by deploy.sh: IMAGE_TAG
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

probes:
  liveness:
    path: /health
    port: 8000
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health
    port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

config:
  appName: "atlas-platform-app"
  environment: "default"
  logLevel: "info"