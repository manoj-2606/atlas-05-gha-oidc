# =============================================================================
# Pre-commit hooks — DevSecOps at commit time
# gitleaks: secrets never reach Git history
# terraform_fmt: consistent formatting (catches CI failures early)
# terraform_validate: syntax errors caught before push
# =============================================================================

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate